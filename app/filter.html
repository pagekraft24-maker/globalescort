<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex, nofollow">
<title>App-Vorschau: Filter – globalescort.de</title>
<link rel="stylesheet" href="/app/app.css">
<script src="/app/app.js" defer></script>
</head>
<body>
<main class="screen">
  <div class="bar">
    <button type="button" class="icon-btn" aria-label="Zurück">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 class="xc" style="margin:0;font-size:30px">Filter</h1>
    <button type="button" class="link-btn" data-reset>Zurücksetzen</button>
  </div>
  <div style="padding:8px 20px 0;display:flex;align-items:center;gap:8px;font-size:14px" class="muted">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5C5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span><strong style="color:#F3F1EE">Stuttgart</strong> + 20 km</span>
  </div>
  <div class="groups">
    <div class="group"><h2>Typ</h2><div class="chips">
      <button type="button" class="chip" aria-pressed="false">Natürlich</button><button type="button" class="chip" aria-pressed="true">Elegant</button><button type="button" class="chip" aria-pressed="false">Sportlich</button><button type="button" class="chip" aria-pressed="false">Kurvig</button><button type="button" class="chip" aria-pressed="false">Zierlich</button>
    </div></div>
    <div class="group"><h2>Haarfarbe</h2><div class="chips">
      <button type="button" class="chip" aria-pressed="false">Blond</button><button type="button" class="chip" aria-pressed="true">Brünett</button><button type="button" class="chip" aria-pressed="false">Schwarz</button><button type="button" class="chip" aria-pressed="false">Rot</button>
    </div></div>
    <div class="group"><h2>Alter</h2><div class="chips">
      <button type="button" class="chip" aria-pressed="false">18–25</button><button type="button" class="chip" aria-pressed="true">26–35</button><button type="button" class="chip" aria-pressed="false">36–45</button><button type="button" class="chip" aria-pressed="false">45+</button>
    </div></div>
    <div class="group"><h2>Extras</h2><div class="chips">
      <button type="button" class="chip" aria-pressed="true">Neu</button><button type="button" class="chip" aria-pressed="false">Duo</button><button type="button" class="chip" aria-pressed="false">Private Galerie</button><button type="button" class="chip" aria-pressed="false">Heute verfügbar</button><button type="button" class="chip" aria-pressed="false">Verifiziert</button>
    </div></div>
  </div>
  <div class="bottom" style="border-top:1px solid #222">
    <button type="button" class="cta"><span data-count>28</span> Damen anzeigen</button>
  </div>
</main>
</body>
</html>
