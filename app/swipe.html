<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex, nofollow">
<title>App-Vorschau: Swipe – globalescort.de</title>
<link rel="stylesheet" href="/app/app.css">
<script src="/app/app.js" defer></script>
</head>
<body>
<main class="screen">
  <div class="top">
    <span class="brand">GLOBALESCORT<span>.DE</span></span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:#171717;border:1px solid #333;border-radius:999px;font-size:13px;font-weight:700">
      <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF5C5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/></svg>
      Stuttgart
    </span>
  </div>
  <h1 class="sr-only">Damen durchswipen</h1>
  <div class="stack">
    <div class="card card--back" aria-hidden="true"><img src="/assets/img/p2.webp" alt=""></div>
    <div class="card card--front">
      <img src="/assets/img/p1.webp" alt="Beispielprofil Lena" draggable="false">
      <div class="card-fade"></div>
      <div class="badges"><span class="badge badge--red" data-badge>Neu</span><span class="badge">✓ Verifiziert</span></div>
      <span class="stamp-like" aria-hidden="true">MERKEN</span>
      <span class="stamp-nope" aria-hidden="true">WEITER</span>
      <div class="info">
        <div class="name"><b data-name>Lena</b><span data-age>26</span></div>
        <div class="meta" data-meta>Agentur A · 2 km</div>
        <div class="tags" data-tags><span>Elegant</span><span>Brünett</span><span>Deutsch, Englisch</span></div>
      </div>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="round round--nope" aria-label="Weiter" data-nope>
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" class="round round--sm" aria-label="Private Galerie ansehen">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </button>
    <button type="button" class="round round--like" aria-label="Merken" data-like>
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-7.8-7.5a5.5 5.5 0 0 1 7.8-7.8 5.5 5.5 0 0 1 7.8 7.8z"/></svg>
    </button>
  </div>
  <div class="hint" data-hint>Wische oder tippe: ✕ weiter · ♥ merken</div>
</main>
</body>
</html>
