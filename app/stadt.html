<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex, nofollow">
<title>App-Vorschau: Stadt wählen – globalescort.de</title>
<link rel="stylesheet" href="/app/app.css">
<script src="/app/app.js" defer></script>
</head>
<body>
<main class="screen">
  <div class="top">
    <span class="brand">GLOBALESCORT<span>.DE</span></span>
    <span class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em">18+</span>
  </div>
  <div style="padding:28px 20px 0">
    <h1 class="h1 xc">Wo bist<br><span>du heute?</span></h1>
    <label class="search">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A09B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="sr-only">Stadt suchen</span>
      <input type="text" placeholder="Stadt oder PLZ">
    </label>
    <button type="button" class="locate">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>
      Meinen Standort verwenden
    </button>
  </div>
  <div style="padding:10px 20px 0">
    <div class="label">Beliebte Städte</div>
    <div class="cities">
      <button type="button" class="city" aria-pressed="true"><b>Stuttgart</b><small>48 Damen</small></button>
      <button type="button" class="city" aria-pressed="false"><b>München</b><small>63 Damen</small></button>
      <button type="button" class="city" aria-pressed="false"><b>Frankfurt</b><small>41 Damen</small></button>
      <button type="button" class="city" aria-pressed="false"><b>Berlin</b><small>87 Damen</small></button>
      <button type="button" class="city" aria-pressed="false"><b>Hamburg</b><small>55 Damen</small></button>
      <button type="button" class="city" aria-pressed="false"><b>Köln</b><small>39 Damen</small></button>
    </div>
  </div>
  <div class="bottom">
    <button type="button" class="cta">Damen in <span data-city-name>Stuttgart</span> ansehen</button>
  </div>
</main>
</body>
</html>
