<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex, nofollow">
<title>App-Vorschau: Private Galerie – globalescort.de</title>
<link rel="stylesheet" href="/app/app.css">
<script src="/app/app.js" defer></script>
</head>
<body>
<main class="screen galerie locked">
  <div class="head">
    <img src="/assets/img/p4.webp" alt="Beispielprofil Nora">
    <div class="head-fade"></div>
    <div class="head-info">
      <div>
        <div class="name"><b>Nora</b><span>35</span></div>
        <div class="meta" style="margin-top:4px">Agentur A · Stuttgart</div>
      </div>
      <button type="button" class="fav" aria-label="Merken">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-7.8-7.5a5.5 5.5 0 0 1 7.8-7.8 5.5 5.5 0 0 1 7.8 7.8z"/></svg>
      </button>
    </div>
  </div>
  <div class="gal-head">
    <div>
      <h1 class="gal-title xc" style="margin:0">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8C26A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Private Galerie
      </h1>
      <div class="muted" style="margin-top:4px;font-size:13px">12 exklusive Bilder · nur 18+</div>
    </div>
    <span class="status" data-status>Gesperrt</span>
  </div>
  <div class="grid">
    <div class="tile"><img src="/assets/img/p4.webp" alt=""><span class="lock"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></div>
    <div class="tile"><img src="/assets/img/p1.webp" alt=""><span class="lock"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></div>
    <div class="tile"><img src="/assets/img/p5.webp" alt=""><span class="lock"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></div>
    <div class="tile"><img src="/assets/img/p2.webp" alt=""><span class="lock"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></div>
    <div class="tile"><img src="/assets/img/p6.webp" alt=""><span class="lock"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></div>
    <div class="tile"><img src="/assets/img/p3.webp" alt=""><span class="lock"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F3F1EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></div>
  </div>
  <div class="bottom">
    <button type="button" class="cta cta--gold" data-unlock>Galerie freischalten</button>
    <button type="button" class="cta" data-book>Jetzt bei Agentur A buchen</button>
    <div class="fineprint">Zugang nur nach Altersverifikation. Bezahlung sicher &amp; diskret.</div>
  </div>
</main>
</body>
</html>
